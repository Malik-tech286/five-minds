<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خمس عقول</title>
<style>
:root{--bg:#f3f6fa;--ink:#14233b;--mut:#5b6b82;--card:#fff;--line:#d5dde9;--acc:#2b5bd7;--on:#fff;--mark:#ffd84d;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1724;--ink:#e6ecf5;--mut:#93a3ba;--card:#172236;--line:#2a3a54;--acc:#7da2ff;--on:#0f1724;--mark:#c9a21a;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 "Noto Naskh Arabic","Noto Sans Arabic",system-ui,sans-serif;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:16px 0 40px}
h1{font-size:1.6rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 14px}
textarea,input,select{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;margin:10px 0 16px}
.row select{flex:1}
button{font:inherit;border:0;border-radius:8px;padding:10px 22px;background:var(--acc);color:var(--on);cursor:pointer}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.final{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--mark);border-radius:8px;padding:6px 16px 12px;margin-bottom:14px}
.final h2{font-size:1.2rem;margin:8px 0}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.txt h3{font-size:1.05rem;margin:10px 0 0;display:block}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 14px;margin-bottom:8px}
summary{cursor:pointer;font-weight:700}
summary span{font-weight:400;color:var(--mut);margin-inline-start:10px;font-size:.9rem}
.err{color:var(--err)}
.prov{display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;align-items:center;margin:8px 0}
.prov input{direction:ltr;font-size:.85rem;padding:8px}
.note{color:var(--mut);font-size:.9rem}
@media (max-width:560px){.prov{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>خمس عقول، شرح واحد</h1>
<p class="sub">اكتب الدرس أو السؤال، والأدوات الخمسة يتعاونوا، وClaude يجمعلك الشرح في الآخر.</p>
<textarea id="q" placeholder="مثال: اشرحلي قانون نيوتن الثاني"></textarea>
<div class="row">
<select id="lvl" aria-label="المستوى"><option>ابتدائي</option><option>إعدادي</option><option selected>ثانوي</option><option>جامعي</option></select>
<button id="go">اشرحلي</button>
</div>
<div id="out"></div>
<details id="set"><summary>الإعدادات: المفاتيح والموديلات</summary>
<div id="cfg"></div>
<p class="note">المفاتيح محفوظة على جهازك بس. أي مفتاح تسيبه فاضي، الأداة دي بتتخطى. الموديل الفاضي بيستخدم الافتراضي.</p>
</details>
</main>
<script>
const $=id=>document.getElementById(id);
const NAMES={claude:"Claude",openai:"ChatGPT",deepseek:"DeepSeek",perplexity:"Perplexity",gemini:"Gemini"};
const DEF={claude:"claude-sonnet-5-5",openai:"gpt-4o-mini",deepseek:"deepseek-chat",perplexity:"sonar",gemini:"gemini-2.5-flash"};
const ROLES={
 perplexity:["الباحث","ابحث وهات المعلومات الدقيقة والمحدّثة عن الموضوع مع المصادر."],
 deepseek:["المنطق","اشرح الفكرة خطوة بخطوة بمنطق واضح، وحُلّ مثالًا أو مسألة لو الدرس فيه حسابات."],
 gemini:["المبسّط","بسّط الشرح بلغة سهلة وهات تشبيهات وأمثلة من الحياة اليومية."],
 openai:["المدرّب","اعمل ملخصًا من 5 نقاط، وبعده 5 أسئلة تدريب متنوعة مع إجاباتها."]
};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const md=s=>esc(s).replace(/^#{1,4}\s*(.+)$/gm,"<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^\s*[-*]\s+/gm,"• ");
let cfg;try{cfg=JSON.parse(localStorage.getItem("cfg"))}catch{}
cfg=cfg||{};cfg.keys=cfg.keys||{};cfg.models=cfg.models||{};
const save=()=>{try{localStorage.setItem("cfg",JSON.stringify(cfg))}catch{}};

const J=async(url,h,b)=>{
 const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json",...h},body:JSON.stringify(b)});
 const t=typeof r.text==="function"?await r.text():JSON.stringify(r.data);
 let d;try{d=JSON.parse(t)}catch{throw new Error(t.slice(0,200))}
 if(!r.ok)throw new Error(d.error?.message||JSON.stringify(d.error||d).slice(0,200));
 return d;
};
const oa=u=>async(k,m,p)=>{
 const d=await J(u,{Authorization:"Bearer "+k},{model:m,messages:[{role:"user",content:p}]});
 let t=d.choices[0].message.content;
 if(d.citations?.length)t+="\n\nالمصادر:\n"+d.citations.map((c,i)=>(i+1)+". "+c).join("\n");
 return t;
};
const CALL={
 claude:async(k,m,p)=>(await J("https://api.anthropic.com/v1/messages",{"x-api-key":k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},{model:m,max_tokens:2500,messages:[{role:"user",content:p}]})).content.map(c=>c.text||"").join(""),
 gemini:async(k,m,p)=>(await J(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${k}`,{},{contents:[{parts:[{text:p}]}]})).candidates[0].content.parts.map(x=>x.text||"").join(""),
 openai:oa("https://api.openai.com/v1/chat/completions"),
 deepseek:oa("https://api.deepseek.com/chat/completions"),
 perplexity:oa("https://api.perplexity.ai/chat/completions")
};
const ask=(id,p)=>CALL[id](cfg.keys[id],cfg.models[id]||DEF[id],p);

for(const id in NAMES){
 const d=document.createElement("div");d.className="prov";
 d.innerHTML=`<b>${NAMES[id]}</b><input type="password" dir="ltr" placeholder="API key"><input dir="ltr" placeholder="${DEF[id]}">`;
 const [k,m]=d.querySelectorAll("input");
 k.value=cfg.keys[id]||"";m.value=cfg.models[id]||"";
 k.oninput=()=>{cfg.keys[id]=k.value.trim();save()};
 m.oninput=()=>{cfg.models[id]=m.value.trim();save()};
 $("cfg").append(d);
}
const fail=e=>'<span class="err">'+esc(String(e.message||e))+"</span>";

$("go").onclick=async()=>{
 const q=$("q").value.trim();if(!q)return;
 const have=Object.keys(NAMES).filter(id=>cfg.keys[id]);
 const out=$("out");out.innerHTML="";
 if(!have.length){$("set").open=true;out.innerHTML='<p class="err">حط مفتاح واحد على الأقل في الإعدادات تحت.</p>';return}
 $("go").disabled=true;
 const base=`أنا طالب مستوى ${$("lvl").value}. الدرس أو السؤال: ${q}\nاكتب بالعربية الواضحة.\n`;
 const fin=document.createElement("section");fin.className="final";
 fin.innerHTML='<h2>الشرح النهائي</h2><div class="txt">جاري الشغل…</div>';out.append(fin);
 const finTxt=fin.querySelector(".txt"),got={};
 const ex=have.filter(id=>ROLES[id]);
 await Promise.all(ex.map(async id=>{
  const d=document.createElement("details");
  d.innerHTML=`<summary>${NAMES[id]}<span>${ROLES[id][0]}</span></summary><div class="txt">جاري التفكير…</div>`;
  out.append(d);const t=d.querySelector(".txt");
  try{got[id]=await ask(id,base+"مهمتك: "+ROLES[id][1]);t.innerHTML=md(got[id])}catch(e){t.innerHTML=fail(e)}
 }));
 const syn=have.includes("claude")?"claude":have[0];
 const parts=Object.entries(got).map(([id,t])=>`### ${NAMES[id]}\n${t}`).join("\n\n");
 const sp=base+(parts
  ?`دي إجابات من أدوات مختلفة:\n\n${parts}\n\nاجمعها في شرح واحد مترابط ومنظم بعناوين قصيرة: فكرة الدرس، الشرح المبسط، مثال، ملخص، أسئلة تدريب. صحّح أي تعارض بينها، ولو معلومة مش مؤكدة قول كده.`
  :"اشرح الدرس شرحًا كاملًا ومبسطًا مع مثال وملخص.");
 try{finTxt.innerHTML=md(await ask(syn,sp))}catch(e){finTxt.innerHTML=fail(e)}
 $("go").disabled=false;
};
if(!Object.keys(cfg.keys).some(k=>cfg.keys[k]))$("set").open=true;
</script>
</body>
</html>
