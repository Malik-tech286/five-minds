<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a2bb8">
<title>خمس عقول</title>
<style>
:root{--bg:#f6f4fb;--card:#fff;--ink:#1d1b3a;--mut:#8b88a6;--line:#e6e2f2;--ind:#3d2bb8;--pur:#7a2cc0;--pink:#f0189a;--lav:#c9b3e6;--sh:0 6px 20px rgba(61,43,184,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#121022;--card:#1c1933;--ink:#ecebf7;--mut:#9a97b8;--line:#2c2950;--sh:0 6px 20px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.8 "Noto Naskh Arabic","Noto Sans Arabic",system-ui,sans-serif}
header{background:linear-gradient(135deg,var(--ind),var(--pur));color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 18px 0}
.bar{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.2rem}
.logo svg{width:28px;height:28px}
#menu{background:none;border:0;padding:8px;color:#fff;cursor:pointer}
#menu svg{width:26px;height:26px;display:block}
header label{display:block;margin-top:16px;font-size:.9rem;opacity:.85}
#q{width:100%;background:transparent;border:0;border-bottom:2px solid rgba(255,255,255,.5);color:#fff;font:inherit;font-size:1.2rem;padding:6px 0;resize:none;min-height:66px;outline:0}
#q::placeholder{color:rgba(255,255,255,.6)}
#q:focus{border-bottom-color:#fff}
.wave{display:block;width:calc(100% + 36px);margin:4px -18px -1px;height:46px}
.w1{fill:var(--lav);opacity:.55}.w2{fill:var(--bg)}
main{max-width:720px;margin:0 auto;padding:4px 16px calc(40px + env(safe-area-inset-bottom))}
.sec{font-weight:800;text-align:center;margin:6px 0;font-size:.95rem}
.tiles{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.tile{flex:0 0 112px;border:0;text-align:start;color:#fff;background:linear-gradient(135deg,var(--ind),var(--pur));border-radius:10px;padding:10px 12px;font:inherit;line-height:1.5;box-shadow:var(--sh);cursor:pointer}
.tile b{display:block;font-size:.95rem}
.tile small{opacity:.8;font-size:.78rem}
.tile .st{display:block;margin-top:6px;font-size:.85rem}
.tile.off{background:linear-gradient(135deg,#d8c7ee,#e9b8dc);color:#5b3d86}
.tile.err{background:linear-gradient(135deg,#a3155f,var(--pink))}
.chips{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 16px;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:linear-gradient(135deg,var(--ind),var(--pur));color:#fff;border-color:transparent}
#go{display:block;margin:6px auto 20px;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:12px 48px;font:inherit;font-weight:700;box-shadow:0 8px 18px rgba(240,24,154,.35);cursor:pointer}
#go:disabled{background:#c9c6d6;box-shadow:none}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.final{background:var(--card);border-radius:14px;box-shadow:var(--sh);border-top:4px solid var(--pink);padding:10px 18px 16px;margin-bottom:18px}
.final h2{margin:4px 0;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.final h2 small{color:var(--mut);font-weight:400;font-size:.8rem}
.okc{display:none;width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;font-size:.8rem;align-items:center;justify-content:center}
.final.done .okc{display:inline-flex}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.txt h3{font-size:1.05rem;margin:10px 0 0;display:block}
hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.err{color:var(--pink)}
.tl{position:relative;padding-inline-start:26px}
.tl::before{content:"";position:absolute;inset-inline-start:6px;top:10px;bottom:10px;width:2px;background:var(--line)}
.item{position:relative;background:var(--card);border-radius:10px;box-shadow:var(--sh);padding:4px 14px;margin-bottom:10px}
.item::before{content:"";position:absolute;inset-inline-start:-26px;top:14px;width:14px;height:14px;border-radius:50%;border:2px solid var(--lav);background:var(--bg)}
.item.good::before{background:var(--ind);border-color:var(--ind)}
.item.bad::before{background:var(--pink);border-color:var(--pink)}
summary{cursor:pointer;font-weight:700}
summary span{font-weight:400;color:var(--mut);margin-inline-start:10px;font-size:.85rem}
#scrim{position:fixed;inset:0;background:rgba(10,8,30,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
#scrim.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(92vw,440px);background:var(--card);box-shadow:var(--sh);transform:translateX(-105%);transition:transform .25s;z-index:20;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 16px) 18px 28px}
#drawer.open{transform:none}
#drawer h2{margin:0 0 4px;font-size:1.2rem;display:flex;justify-content:space-between;align-items:center}
#close{background:none;border:0;color:var(--ink);font-size:1.6rem;line-height:1;cursor:pointer;padding:4px 8px}
.prov{margin:14px 0}
.prov input{display:block;width:100%;margin-top:6px;font:inherit;font-size:.9rem;direction:ltr;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.note{color:var(--mut);font-size:.88rem}
#splash{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ind);transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}
#splash .logo{font-size:2rem;color:var(--ind)}
#splash .logo svg{width:52px;height:52px}
#splash p{margin:0;color:var(--mut)}
@media (prefers-color-scheme:dark){#splash,#splash .logo{color:#fff}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="lg" viewBox="0 0 32 32"><path d="M16 3 29 27H3Z" fill="currentColor" opacity=".9"/><path d="M16 13 24 27H8Z" fill="#f0189a"/></symbol></svg>
<div id="splash"><div class="logo"><svg><use href="#lg"/></svg>خمس عقول</div><p>مذاكرة أسهل، بخمس عقول</p></div>
<header>
<div class="bar">
<div class="logo"><svg><use href="#lg"/></svg>خمس عقول</div>
<button id="menu" aria-label="الإعدادات والمفاتيح"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
</div>
<label for="q">الدرس أو السؤال</label>
<textarea id="q" rows="2" placeholder="مثال: اشرحلي نظرية فيثاغورس"></textarea>
<svg class="wave" viewBox="0 0 400 46" preserveAspectRatio="none" aria-hidden="true"><path class="w1" d="M0 22C80 0 140 44 220 24S340 6 400 20V46H0Z"/><path class="w2" d="M0 30C90 10 150 46 230 30S350 14 400 28V46H0Z"/></svg>
</header>
<main>
<div class="sec">الأدوات</div>
<div class="tiles" id="tiles"></div>
<div class="chips" id="chips" role="group" aria-label="المستوى"></div>
<button id="go">اشرحلي</button>
<div id="out"></div>
</main>
<div id="scrim"></div>
<aside id="drawer" inert>
<h2>الإعدادات <button id="close" aria-label="إغلاق">×</button></h2>
<p class="note">حط مفتاح (API key) لأي أداة عايز تشغّلها. المفاتيح محفوظة على جهازك بس. أي مفتاح فاضي، الأداة دي بتتخطى. الموديل الفاضي بيستخدم الافتراضي.</p>
<div id="cfg"></div>
</aside>
<script>
const $=id=>document.getElementById(id);
const NAMES={claude:"Claude",openai:"ChatGPT",deepseek:"DeepSeek",perplexity:"Perplexity",gemini:"Gemini",groq:"Groq",openrouter:"OpenRouter"};
const DEF={claude:"claude-sonnet-5-5",openai:"gpt-4o-mini",deepseek:"deepseek-chat",perplexity:"sonar",gemini:"gemini-3.8-flash",groq:"openai/gpt-oss-120b",openrouter:"openrouter/free"};
const ROLES={
 perplexity:["الباحث","ابحث وهات المعلومات الدقيقة والمحدّثة عن الموضوع مع المصادر."],
 deepseek:["المنطق","اشرح الفكرة خطوة بخطوة بمنطق واضح، وحُلّ مثالًا أو مسألة لو الدرس فيه حسابات."],
 gemini:["المبسّط","بسّط الشرح بلغة سهلة وهات تشبيهات وأمثلة من الحياة اليومية."],
 openai:["المدرّب","اعمل ملخصًا من 5 نقاط، وبعده 5 أسئلة تدريب متنوعة مع إجاباتها."],
 groq:["المراجع","اكتب أهم القواعد والنقاط اللي لازم تتحفظ في نقاط قصيرة، وبعدها الأخطاء الشائعة اللي الطلاب بيقعوا فيها في الدرس ده."],
 openrouter:["الصاحب","لخّص الدرس في فقرة قصيرة جدًا كأنك بتشرح لصاحبك، وبعدها ارسم خريطة ذهنية نصية للدرس."]
};
const LV=["ابتدائي","إعدادي","ثانوي","جامعي"];
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const tex=s=>s.replace(/\\[()\[\]]/g,"").replace(/\$/g,"").replace(/\\(?:text|mathrm|mathbf)\{([^{}]*)\}/g,"$1").replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,"($1)/($2)").replace(/\\sqrt\{([^{}]*)\}/g,"√($1)").replace(/\\(?:times|cdot)/g,"×").replace(/\\div/g,"÷").replace(/\\(?:left|right)/g,"").replace(/\^\{?2\}?(?![0-9])/g,"²").replace(/\^\{?3\}?(?![0-9])/g,"³").replace(/\\[,;]|\\quad/g," ").replace(/[{}]/g,"");
const md=s=>esc(tex(s)).replace(/^#{1,4}\s*(.+)$/gm,"<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^\s*[-*]\s+/gm,"• ").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/^-{3,}$/gm,"<hr>");
let cfg;try{cfg=JSON.parse(localStorage.getItem("cfg"))}catch{}
cfg=cfg||{};cfg.keys=cfg.keys||{};cfg.models=cfg.models||{};cfg.lvl=cfg.lvl||"ثانوي";
const save=()=>{try{localStorage.setItem("cfg",JSON.stringify(cfg))}catch{}};

const J=async(url,h,b)=>{
 const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json",...h},body:JSON.stringify(b)});
 const t=typeof r.text==="function"?await r.text():JSON.stringify(r.data);
 let d;try{d=JSON.parse(t)}catch{throw new Error(t.slice(0,200))}
 if(!r.ok)throw new Error(d.error?.message||JSON.stringify(d.error||d).slice(0,200));
 return d;
};
const oa=u=>async(k,m,p)=>{
 const d=await J(u,{Authorization:"Bearer "+k},{model:m,messages:[{role:"user",content:p}]});
 let t=d.choices[0].message.content;
 if(d.citations?.length)t+="\n\nالمصادر:\n"+d.citations.map((c,i)=>(i+1)+". "+c).join("\n");
 return t;
};
const CALL={
 claude:async(k,m,p)=>(await J("https://api.anthropic.com/v1/messages",{"x-api-key":k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},{model:m,max_tokens:2500,messages:[{role:"user",content:p}]})).content.map(c=>c.text||"").join(""),
 gemini:async(k,m,p)=>(await J(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${k}`,{},{contents:[{parts:[{text:p}]}]})).candidates[0].content.parts.map(x=>x.text||"").join(""),
 openai:oa("https://api.openai.com/v1/chat/completions"),
 deepseek:oa("https://api.deepseek.com/chat/completions"),
 perplexity:oa("https://api.perplexity.ai/chat/completions"),
 groq:oa("https://api.groq.com/openai/v1/chat/completions"),
 openrouter:oa("https://openrouter.ai/api/v1/chat/completions")
};
const ask=(id,p)=>CALL[id](cfg.keys[id],cfg.models[id]||DEF[id],p);

const S={};
const setS=(id,t,e)=>{S[id]={t,e};tiles()};
function tiles(){
 const el=$("tiles");el.innerHTML="";
 for(const id in NAMES){
  const on=!!cfg.keys[id],s=S[id]||{};
  const b=document.createElement("button");
  b.className="tile"+(on?"":" off")+(s.e?" err":"");
  b.innerHTML=`<b>${NAMES[id]}</b><small>${ROLES[id]?ROLES[id][0]:"المجمّع"}</small><span class="st">${on?(s.t||"جاهز"):"حط مفتاح"}</span>`;
  b.onclick=()=>{if(!on)openMenu()};
  el.append(b);
 }
}
function chips(){
 const c=$("chips");c.innerHTML="";
 LV.forEach(v=>{const b=document.createElement("button");b.className="chip";b.textContent=v;b.setAttribute("aria-pressed",cfg.lvl===v);b.onclick=()=>{cfg.lvl=v;save();chips()};c.append(b)});
}
function openMenu(){$("drawer").inert=false;$("drawer").classList.add("open");$("scrim").classList.add("open")}
function closeMenu(){$("drawer").classList.remove("open");$("scrim").classList.remove("open");$("drawer").inert=true}
$("menu").onclick=openMenu;$("close").onclick=closeMenu;$("scrim").onclick=closeMenu;

for(const id in NAMES){
 const d=document.createElement("div");d.className="prov";
 d.innerHTML=`<b>${NAMES[id]}</b><input type="password" placeholder="API key" autocomplete="off"><input placeholder="${DEF[id]}">`;
 const [k,m]=d.querySelectorAll("input");
 k.value=cfg.keys[id]||"";m.value=cfg.models[id]||"";
 k.oninput=()=>{cfg.keys[id]=k.value.trim();save();tiles()};
 m.oninput=()=>{cfg.models[id]=m.value.trim();save()};
 $("cfg").append(d);
}
const fail=e=>'<span class="err">'+esc(String(e.message||e))+"</span>";

$("go").onclick=async()=>{
 const q=$("q").value.trim();if(!q)return;
 const have=Object.keys(NAMES).filter(id=>cfg.keys[id]);
 const out=$("out");out.innerHTML="";
 if(!have.length){openMenu();return}
 $("go").disabled=true;
 have.forEach(id=>setS(id,"في الانتظار"));
 const base=`أنا طالب مستوى ${cfg.lvl}. الدرس أو السؤال: ${q}\nاكتب بالعربية الواضحة. اكتب الأرقام والمعادلات كنص عادي بس (مثال: 3² + 4² = 5²) من غير LaTeX ولا علامة $.\n`;
 const fin=document.createElement("section");fin.className="final";
 fin.innerHTML='<h2><span class="okc">✓</span>الشرح النهائي<small></small></h2><div class="txt">جاري الشغل…</div>';out.append(fin);
 fin.scrollIntoView();
 const finTxt=fin.querySelector(".txt"),got={};
 const ex=have.filter(id=>ROLES[id]);
 const tl=document.createElement("div");tl.className="tl";out.append(tl);
 await Promise.all(ex.map(async id=>{
  const d=document.createElement("details");d.className="item";
  d.innerHTML=`<summary>${NAMES[id]}<span>${ROLES[id][0]}</span></summary><div class="txt">جاري التفكير…</div>`;
  tl.append(d);const t=d.querySelector(".txt");setS(id,"جاري…");
  try{got[id]=await ask(id,base+"مهمتك: "+ROLES[id][1]);t.innerHTML=md(got[id]);d.classList.add("good");setS(id,"تم")}
  catch(e){t.innerHTML=fail(e);d.classList.add("bad");d.open=true;setS(id,"خطأ",1)}
 }));
 const PREF=["claude","gemini","openai","deepseek","groq","openrouter","perplexity"].filter(id=>cfg.keys[id]);
 const parts=Object.entries(got).map(([id,t])=>`### ${NAMES[id]}\n${t}`).join("\n\n");
 const sp=base+(parts
  ?`دي إجابات من أدوات مختلفة:\n\n${parts}\n\nاجمعها في شرح واحد مترابط ومنظم بعناوين قصيرة: فكرة الدرس، الشرح المبسط، مثال، ملخص، أسئلة تدريب. صحّح أي تعارض بينها، ولو معلومة مش مؤكدة قول كده.`
  :"اشرح الدرس شرحًا كاملًا ومبسطًا مع مثال وملخص.");
 let last=null;
 for(const id of PREF){
  try{finTxt.innerHTML=md(await ask(id,sp));fin.querySelector("small").textContent="جمّعه "+NAMES[id];fin.classList.add("done");last=null;break}
  catch(e){last=e}
 }
 if(last)finTxt.innerHTML=fail(last);
 $("go").disabled=false;
};
tiles();chips();
setTimeout(()=>{$("splash").classList.add("hide");if(!Object.values(cfg.keys).some(Boolean))openMenu()},900);
</script>
</body>
</html>
